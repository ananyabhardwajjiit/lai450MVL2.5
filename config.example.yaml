# lfm-vision configuration
# Generated by the installer on first run.
# Edit this file and re-run install.sh to apply changes.

# Which model to load. Currently: 450m
# (more sizes will be added as Liquid AI releases them)
model: 450m

# Network ports
api_port: 8000        # llama-server (OpenAI-compatible API)
status_port: 80       # landing page with system + model info
webui_port: 8080      # OpenWebUI (only used if with_openwebui: true)

# Optional features
with_openwebui: false    # set true to also install the OpenWebUI chat UI
with_status_page: true   # set false for headless installs (minimal preset)

# Performance tuning. Set to "auto" to let the installer decide based on
# detected CPU threads and RAM. Otherwise set an explicit number.
context_size: auto       # tokens of context window (e.g. 2048, 4096, 8192)
threads: auto            # CPU threads llama.cpp uses for inference
parallel: auto           # number of concurrent request slots

# Filesystem layout. Change these for custom install paths.
install_dir: /opt/lfm-vision
data_dir:    /var/lib/lfm-vision

# Examples of explicit overrides:
#   context_size: 16384
#   threads: 6
#   parallel: 4
